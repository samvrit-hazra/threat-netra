{% extends "shared/frontend/base.html" %}

{% block title %}Login - Threat Netra{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Login to Threat Netra</h2>
    <p>Sign in to access the threat intelligence dashboard.</p>
    
    <!-- This form will later be wired to Supabase -->
    <form class="auth-form" id="loginForm" method="POST" action="/auth/login">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="agent@threatnetra.gov">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>
        
        <button type="submit" class="button auth-button">Sign In</button>
    </form>
    
    <div class="auth-links">
        <p>Don't have an account? <a href="#">Contact Administrator</a></p>
    </div>
</div>
{% endblock %}
